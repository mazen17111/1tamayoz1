      /* Bulletproof storage and webview protection for Telegram, WhatsApp, and sandboxed mobile browsers */

        var memoryStore = {};

        // 1. Wrap Storage prototype so direct method calls never throw SecurityError or QuotaExceeded
        try {
          if (typeof Storage !== 'undefined' && Storage.prototype) {
            var origGet = Storage.prototype.getItem;
            var origSet = Storage.prototype.setItem;
            var origRem = Storage.prototype.removeItem;
            var origClr = Storage.prototype.clear;

            Storage.prototype.getItem = function(k) {
              try {
                return origGet.call(this, k);
              } catch (e) {
                return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null;
              }
            };

            Storage.prototype.setItem = function(k, v) {
              try {
                origSet.call(this, k, v);
              } catch (e) {
                memoryStore[k] = String(v);
              }
            };

            Storage.prototype.removeItem = function(k) {
              try {
                origRem.call(this, k);
              } catch (e) {
                delete memoryStore[k];
              }
            };

            Storage.prototype.clear = function() {
              try {
                origClr.call(this);
              } catch (e) {
                memoryStore = {};
              }
            };
          }
        } catch (protoErr) {}

        // 2. Test if window.localStorage is accessible; if not, safely polyfill
        var works = false;
        try {
          var testKey = '__tamayuz_probe__';
          window.localStorage.setItem(testKey, '1');
          window.localStorage.removeItem(testKey);
          works = true;
        } catch (e) {
          works = false;
        }

        if (!works) {
          var poly = {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(memoryStore, k) ? memoryStore[k] : null; },
            setItem: function(k, v) { memoryStore[k] = String(v); },
            removeItem: function(k) { delete memoryStore[k]; },
            clear: function() { memoryStore = {}; },
            get length() { return Object.keys(memoryStore).length; },
            key: function(i) { return Object.keys(memoryStore)[i] || null; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: poly, configurable: true, writable: true });
            Object.defineProperty(window, 'sessionStorage', { value: poly, configurable: true, writable: true });
          } catch (ex) {
            try { window.localStorage = poly; } catch (e2) {}
            try { window.sessionStorage = poly; } catch (e3) {}
          }
        }

        // 3. Polyfill window.matchMedia for older Android/iOS webview instances
        if (typeof window.matchMedia !== 'function') {
          window.matchMedia = function() {
            return {
              matches: false,
              media: '',
              onchange: null,
              addListener: function() {},
              removeListener: function() {},
              addEventListener: function() {},
              removeEventListener: function() {},
              dispatchEvent: function() { return false; }
            };
          };
